apiVersion: apps/v1
kind: Deployment
metadata:
  name: research-agent-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: research-agent-api
  template:
    metadata:
      labels:
        app: research-agent-api
    spec:
      containers:
        - name: api
          image: research-agent:latest
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 8000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: research-agent-api
spec:
  minReplicas: 3
  maxReplicas: 20
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: research-agent-api
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
