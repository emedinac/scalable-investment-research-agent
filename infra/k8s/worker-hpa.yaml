apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: research-agent-worker
spec:
  minReplicas: 5
  maxReplicas: 100
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: research-agent-worker
  metrics:
    - type: External
      external:
        metric:
          name: redis_stream_length
        target:
          type: AverageValue
          averageValue: "50"
