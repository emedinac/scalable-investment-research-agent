[project]
name = "scalable-investment-research-agent"
version = "0.1.0"
description = "Production-oriented investment research agent scaffold with FastAPI, LangGraph, caching, guardrails, and observability."
authors = [{ name = "Edgar Medina", email = "edgarmedina1801@gmail.com" }]
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
  "fastapi>=0.136,<0.137",
  "uvicorn[standard]>=0.48,<0.49",
  "pydantic>=2.13,<2.14",
  "pydantic-settings>=2.10,<3",
  "langgraph>=1.2,<1.3",
  "celery>=5.6,<5.7",
  "redis>=7.4,<8",
  "sqlalchemy[asyncio]>=2.0,<2.1",
  "asyncpg>=0.30,<0.31",
  "aiosqlite>=0.21,<0.22",
  "alembic>=1.16,<2",
  "httpx>=0.28,<0.29",
  "prometheus-client>=0.22,<0.23",
  "orjson>=3.10,<4",
  "structlog>=25.1,<26",
  "yfinance>=0.2,<0.3",
  "mlflow>=3.12,<3.13",
  "langfuse>=4.0,<5"
]

[project.optional-dependencies]
mlops = ["dvc>=3.60,<4", "ragas>=0.3,<0.4"]

[project.scripts]
research-agent-api = "research_agent.main:run"
research-agent-worker = "research_agent.tasks.celery_app:worker_main"

[tool.poetry]
packages = [{ include = "research_agent", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = ">=8.3,<9"
pytest-asyncio = ">=0.25,<1"
httpx = ">=0.28,<0.29"
ruff = ">=0.14,<0.15"
locust = ">=2.33,<3"
streamlit = ">=1.52,<2"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
